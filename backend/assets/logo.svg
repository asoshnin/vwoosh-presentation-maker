<svg width="200" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple placeholder logo -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0072C6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#76B900;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rectangle with gradient -->
  <rect width="200" height="100" fill="url(#grad1)" rx="10" ry="10"/>

  <!-- Company name text -->
  <text x="100" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">
    AI Presentation
  </text>
  <text x="100" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="white">
    Maker
  </text>

  <!-- Simple icon (circle with AI) -->
  <circle cx="30" cy="50" r="15" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="2"/>
  <text x="30" y="56" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white" font-weight="bold">
    AI
  </text>
</svg>
